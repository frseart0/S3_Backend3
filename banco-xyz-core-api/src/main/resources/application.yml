server:
  port: 8080

spring:
  application:
    name: banco-xyz-core-api
  config:
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}
  cloud:
    config:
      request-connect-timeout: 500
      request-read-timeout: 500

  datasource:
    url: jdbc:postgresql://localhost:5432/banco_xyz
    username: banco_xyz
    password: banco_xyz
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      platform: postgresql
      # El esquema de negocio (modulo banco-xyz-domain) se aplica primero para
      # garantizar que las tablas que escribe el batch existan antes de que
      # schema-api.sql siembre los saldos a partir de ellas.
      schema-locations:
        - classpath:db/schema-negocio.sql
        - classpath:db/schema-api.sql
      data-locations:
        - classpath:db/data-postgresql.sql
      continue-on-error: false

  jackson:
    default-property-inclusion: non_null

core:
  seguridad:
    # Los BFF son los unicos clientes del core-api y se identifican con esta
    # clave en la cabecera X-Internal-Key.
    clave-interna: ${CORE_INTERNAL_KEY:clave-interna-banco-xyz-2026}
    max-intentos-fallidos: 3

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.bancoxyz.core: DEBUG
