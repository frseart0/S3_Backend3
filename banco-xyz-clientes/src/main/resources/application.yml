server:
  port: 8085

spring:
  application:
    name: banco-xyz-clientes
  config:
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}
  cloud:
    config:
      request-connect-timeout: 500
      request-read-timeout: 500
  datasource:
    url: jdbc:postgresql://localhost:5432/banco_xyz
    username: banco_xyz
    password: banco_xyz
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema-negocio.sql
        - classpath:db/schema-api.sql
  jackson:
    default-property-inclusion: non_null

core:
  seguridad:
    clave-interna: ${CORE_INTERNAL_KEY:clave-interna-banco-xyz-2026}
    max-intentos-fallidos: 3
  demo:
    sembrar: true
    password: Banco2026*

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.bancoxyz.clientes: DEBUG
