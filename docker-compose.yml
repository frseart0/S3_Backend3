services:
  postgres:
    image: postgres:16
    container_name: banco-xyz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banco_xyz
      POSTGRES_USER: banco_xyz
      POSTGRES_PASSWORD: banco_xyz
    ports:
      - "5432:5432"
    volumes:
      - banco_xyz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_xyz -d banco_xyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: banco-xyz-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: banco-xyz-config-server
    image: banco-xyz-config-server
    container_name: banco-xyz-config-server
    environment:
      CONFIG_REPO: /config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: banco-xyz-discovery
    image: banco-xyz-discovery
    container_name: banco-xyz-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: banco-xyz-auth-server
    image: banco-xyz-auth-server
    container_name: banco-xyz-auth-server
    environment:
      CONFIG_SERVER: http://config-server:8888
    ports:
      - "9000:9000"
    depends_on:
      config-server:
        condition: service_healthy
      discovery:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 50s

  core-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: banco-xyz-core-api
    image: banco-xyz-core-api
    container_name: banco-xyz-core-api
    environment:
      CONFIG_SERVER: http://config-server:8888
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 50s

  bff-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: banco-xyz-bff-web
    image: banco-xyz-bff-web
    container_name: banco-xyz-bff-web
    environment:
      CONFIG_SERVER: http://config-server:8888
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      discovery:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 50s

  bff-mobile:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: banco-xyz-bff-mobile
    image: banco-xyz-bff-mobile
    container_name: banco-xyz-bff-mobile
    environment:
      CONFIG_SERVER: http://config-server:8888
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      discovery:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 50s

  bff-atm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: banco-xyz-bff-atm
    image: banco-xyz-bff-atm
    container_name: banco-xyz-bff-atm
    environment:
      CONFIG_SERVER: http://config-server:8888
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      discovery:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 50s

  notificaciones:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: banco-xyz-notificaciones
    image: banco-xyz-notificaciones
    container_name: banco-xyz-notificaciones
    environment:
      CONFIG_SERVER: http://config-server:8888
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 50s

volumes:
  banco_xyz_pg_data:
