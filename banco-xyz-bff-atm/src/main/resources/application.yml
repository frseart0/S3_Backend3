server:
  port: 8083

spring:
  application:
    name: banco-xyz-bff-atm
  config:
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}
  cloud:
    config:
      request-connect-timeout: 500
      request-read-timeout: 500
  jackson:
    default-property-inclusion: non_null

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

bff:
  oauth2:
    modo: local
    issuer: http://banco-xyz-auth
    auth-server-url: ${AUTH_SERVER_URL:http://localhost:9000}
    client-secret: ${OAUTH_CLIENT_SECRET:banco-xyz-oauth-2026}
  jwt:
    canal: atm
    emisor: http://banco-xyz-auth
    secreto: ${OAUTH_HMAC_SECRET:secreto-oauth-banco-xyz-compartido-2026-cambiar}
    # Sesion de cajero: el cliente esta de pie frente a la maquina. Si la
    # abandona, el token debe morir solo en minutos.
    duracion-acceso: 3m

  core-api:
    base-url: ${CORE_API_URL:http://localhost:8080}
    clave-interna: ${CORE_INTERNAL_KEY:clave-interna-banco-xyz-2026}
    # Timeouts agresivos: nadie espera 8 segundos frente a un cajero.
    timeout-conexion: 1s
    timeout-lectura: 3s

  atm:
    # Denominacion de los billetes que carga la maquina: todo retiro debe ser
    # multiplo de este valor.
    denominacion: 1000
    # Tope por operacion del canal, ademas del limite que aplica el nucleo.
    monto-maximo: 100000
    # Cuantos movimientos imprime el comprobante de "ultimos movimientos".
    movimientos-comprobante: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      coreAtm:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - com.bancoxyz.bff.common.core.CoreApiException
  retry:
    retryAspectOrder: 2
    instances:
      coreAtm:
        maxAttempts: 2
        waitDuration: 100ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
  timelimiter:
    timeLimiterAspectOrder: 3
    instances:
      coreAtm:
        timeoutDuration: 3s
        cancelRunningFuture: true

logging:
  level:
    root: INFO
    com.bancoxyz.bff: DEBUG
