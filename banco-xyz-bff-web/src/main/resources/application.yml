server:
  port: 8081

spring:
  application:
    name: banco-xyz-bff-web
  config:
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}
  cloud:
    config:
      request-connect-timeout: 500
      request-read-timeout: 500

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

bff:
  oauth2:
    modo: local
    issuer: http://banco-xyz-auth
    auth-server-url: ${AUTH_SERVER_URL:http://localhost:9000}
    client-secret: ${OAUTH_CLIENT_SECRET:banco-xyz-oauth-2026}
  jwt:
    canal: web
    emisor: http://banco-xyz-auth
    secreto: ${OAUTH_HMAC_SECRET:secreto-oauth-banco-xyz-compartido-2026-cambiar}
    # Sesion larga: el usuario trabaja en una pantalla amplia y espera seguir
    # navegando sin reautenticarse.
    duracion-acceso: 30m

  core-api:
    base-url: ${CORE_API_URL:http://localhost:8080}
    clave-interna: ${CORE_INTERNAL_KEY:clave-interna-banco-xyz-2026}
    timeout-conexion: 2s
    timeout-lectura: 8s

  web:
    # Origen del SPA autorizado para consumir este BFF.
    origenes-permitidos: ${WEB_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    # Cuantos movimientos trae el dashboard de una sola vez.
    movimientos-dashboard: 20

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.bancoxyz.bff: DEBUG
